# Copy to config.yaml (listed in .gitignore) and adjust.
camera:
  host: 192.168.0.35
  port: 80
  user: admin
  password: "secret"
  timeout: 5             # seconds per request
  retries: 1             # retry on timeout (first request after idle is often slow)
  invert_v: false        # true for ceiling mount
  invert_h: false
  step_seconds: 0.5      # duration of a single step (ptz --count / MQTT cmd/ptz), like mobile.htm

mqtt:
  host: localhost        # mosquitto on the Pi
  port: 1883
  user: ""
  password: ""
  base_topic: pipc011
  poll_fast: 2           # motion/alarm
  poll_slow: 60          # device info, SD card
  snapshot_interval: 0   # 0 = only on command / on motion
  snapshot_on_motion: true
  allow_raw: false       # enable cmd/raw (testing only)

web:
  host: 0.0.0.0
  port: 5000
